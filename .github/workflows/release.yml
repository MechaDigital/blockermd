name: Release

# Two ways to ship a version (bump Version: in 0-blockermd/blockermd.php first):
#   1. On GitHub: Releases → Draft a new release → tag vX.Y.Z → Publish.
#   2. From git: push a tag like v0.4.0.
# Either way this builds blockermd.zip and attaches it to the release.
# Every site running BlockerMD then sees the update in wp-admin within ~6 hours.
on:
  release:
    types: [published]
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Check the tag matches the plugin version
        run: |
          VER=$(grep -m1 -oP "Version:\s*\K[0-9.]+" 0-blockermd/blockermd.php)
          echo "tag=$TAG plugin=$VER"
          [ "${TAG#v}" = "$VER" ] || { echo "Tag $TAG does not match plugin Version $VER"; exit 1; }

      - name: Lint PHP
        run: find 0-blockermd -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Build blockermd.zip
        run: zip -r blockermd.zip 0-blockermd -x '*.DS_Store'

      - name: Attach to release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" blockermd.zip --clobber
          else
            gh release create "$TAG" blockermd.zip --title "BlockerMD $TAG" --generate-notes
          fi
