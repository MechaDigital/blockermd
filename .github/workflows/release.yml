name: Release

# Push a tag like v0.4.0 and this builds blockermd.zip and publishes a
# GitHub release. Every site running BlockerMD then sees the update in
# wp-admin within about 6 hours.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the plugin version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(grep -m1 -oP "Version:\s*\K[0-9.]+" 0-blockermd/blockermd.php)
          echo "tag=$TAG plugin=$VER"
          [ "$TAG" = "$VER" ] || { echo "Tag v$TAG does not match plugin Version $VER"; exit 1; }

      - name: Lint PHP
        run: find 0-blockermd -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Build blockermd.zip
        run: zip -r blockermd.zip 0-blockermd -x '*.DS_Store'

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" blockermd.zip --title "BlockerMD $GITHUB_REF_NAME" --generate-notes
